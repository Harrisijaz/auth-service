<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{title}}</title>
	<style>
		body { margin: 0; background: #eef2f7; color: #172033; font-family: Arial, Helvetica, sans-serif; }
		.preheader { display: none; max-height: 0; overflow: hidden; opacity: 0; }
		.wrapper { width: 100%; padding: 32px 12px; }
		.card { max-width: 600px; margin: 0 auto; background: #ffffff; border: 1px solid #dbe3ef; border-radius: 8px; overflow: hidden; }
		.header { background: #0f766e; color: #ffffff; padding: 28px 32px; }
		.brand { font-size: 18px; font-weight: 700; letter-spacing: 0; }
		.content { padding: 32px; }
		h1 { margin: 0 0 14px; font-size: 26px; line-height: 1.25; color: #101828; }
		p { margin: 0 0 18px; font-size: 15px; line-height: 1.65; color: #475467; }
		.button { display: inline-block; margin: 8px 0 22px; padding: 13px 20px; background: #0f766e; color: #ffffff !important; text-decoration: none; border-radius: 6px; font-weight: 700; }
		.note { padding: 14px 16px; background: #f8fafc; border: 1px solid #e4e7ec; border-radius: 6px; font-size: 13px; color: #667085; }
		.footer { padding: 22px 32px; background: #f8fafc; color: #667085; font-size: 12px; line-height: 1.6; }
	</style>
</head>
<body>
	<div class="preheader">{{preheader}}</div>
	<div class="wrapper">
		<div class="card">
			<div class="header"><div class="brand">{{appName}}</div></div>
			<div class="content">
				<h1>{{title}}</h1>
				<p>{{intro}}</p>
				<a class="button" href="{{actionUrl}}">{{buttonText}}</a>
				<p class="note">This verification link expires in {{expiry}}. If you did not create this account, you can ignore this email.</p>
			</div>
			<div class="footer">Sent by {{appName}}. Need help? Contact {{supportEmail}}.<br>&copy; {{year}} {{appName}}.</div>
		</div>
	</div>
</body>
</html>
